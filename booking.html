<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Request a Session | BurnStrong Yoga</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      margin: 0;
      background: #f5f2e9;
      color: #303923;
      font-family: inherit;
    }

    .booking-page {
      min-height: 100vh;
      padding: 60px 20px;
      box-sizing: border-box;
    }

    .booking-container {
      max-width: 680px;
      margin: 0 auto;
    }

    .booking-intro {
      margin-bottom: 36px;
      text-align: center;
    }

    .booking-card {
      margin-bottom: 24px;
      padding: 28px;
      border: 1px solid #d7d7ca;
      border-radius: 18px;
      background: #fffdf8;
    }

    .booking-card h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .choice-list {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 18px;
    }

    .choice-button {
      flex: 1 1 150px;
      min-height: 48px;
      padding: 12px 18px;
      border: 1px solid #303923;
      border-radius: 999px;
      background: transparent;
      color: #303923;
      font: inherit;
      cursor: pointer;
    }

    .choice-button[aria-pressed="true"] {
      background: #303923;
      color: #fffdf8;
    }

    .conditional-field {
      margin-top: 22px;
    }

    .conditional-field[hidden] {
      display: none;
    }

    .conditional-field label {
      display: block;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .conditional-field select,
    .conditional-field input {
      box-sizing: border-box;
      width: 100%;
      min-height: 48px;
      padding: 12px;
      border: 1px solid #8b8d7b;
      border-radius: 10px;
      background: white;
      color: #303923;
      font: inherit;
    }

    .booking-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 28px;
    }

    .booking-actions a {
      color: inherit;
    }

    .booking-next {
      padding: 14px 28px;
      border: 0;
      border-radius: 999px;
      background: #303923;
      color: white;
      font: inherit;
      cursor: pointer;
    }

    .booking-next:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    @media (max-width: 520px) {
      .booking-page {
        padding: 36px 16px;
      }

      .booking-card {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <main class="booking-page">
    <div class="booking-container">
      <header class="booking-intro">
        <p>BURNSTRONG YOGA · PUERTO RICO</p>
        <h1>Request a Session</h1>
        <p>Choose your location, session type, and duration to get started.</p>
      </header>

      <form id="session-form">
        <section class="booking-card">
          <h2>1. Where would you like to meet?</h2>

          <div class="choice-list" aria-label="Session location">
            <button class="choice-button" type="button"
                    data-location="beach" aria-pressed="false">
              At the beach
            </button>
            <button class="choice-button" type="button"
                    data-location="residence" aria-pressed="false">
              At my hotel or residence
            </button>
          </div>

          <div id="beach-field" class="conditional-field" hidden>
            <label for="beach-location">Choose your beach</label>
            <select id="beach-location">
              <option value="">Select a beach</option>
              <option value="Escambrón Beach">Escambrón Beach</option>
              <option value="Ocean Park Beach — Calle Taft">Ocean Park Beach — Calle Taft</option>
              <option value="Isla Verde Beach">Isla Verde Beach</option>
            </select>
          </div>

          <div id="address-field" class="conditional-field" hidden>
            <label for="session-address">Hotel or residence address</label>
            <input id="session-address" type="text"
                   autocomplete="street-address"
                   placeholder="Enter the address and area">
          </div>
        </section>

        <section class="booking-card">
          <h2>2. What type of session would you like?</h2>

          <div class="choice-list" aria-label="Session type">
            <button class="choice-button" type="button"
                    data-session-type="private" aria-pressed="false">
              Private Lesson — 1 Person
            </button>
            <button class="choice-button" type="button"
                    data-session-type="couples" aria-pressed="false">
              Couples Yoga — 2 People
            </button>
            <button class="choice-button" type="button"
                    data-session-type="group" aria-pressed="false">
              Private Group Session — 3–7 People
            </button>
          </div>

          <div id="group-size-field" class="conditional-field" hidden>
            <label for="group-size">How many people will attend?</label>
            <select id="group-size">
              <option value="">Select number of people</option>
              <option value="3">3 people</option>
              <option value="4">4 people</option>
              <option value="5">5 people</option>
              <option value="6">6 people</option>
              <option value="7">7 people</option>
            </select>
          </div>
        </section>

        <section class="booking-card">
          <h2>3. How long would you like your session to be?</h2>
          <div class="choice-list" aria-label="Session length">
            <button class="choice-button" type="button" data-duration="60"
                    aria-pressed="false">60 minutes</button>
            <button class="choice-button" type="button" data-duration="75"
                    aria-pressed="false">75 minutes</button>
            <button class="choice-button" type="button" data-duration="90"
                    aria-pressed="false">90 minutes</button>
          </div>
        </section>

        <p id="booking-message" role="status" hidden></p>

        <div class="booking-actions">
          <a href="index.html">← Back to home</a>
          <button class="booking-next" id="booking-next"
                  type="submit" disabled>Continue</button>
        </div>
      </form>
    </div>
  </main>

  <script>
    const locationButtons = document.querySelectorAll("[data-location]");
    const durationButtons = document.querySelectorAll("[data-duration]");
    const sessionTypeButtons = document.querySelectorAll("[data-session-type]");
    const groupSizeField = document.getElementById("group-size-field");
    const groupSizeSelect = document.getElementById("group-size");
    const beachField = document.getElementById("beach-field");
    const addressField = document.getElementById("address-field");
    const beachSelect = document.getElementById("beach-location");
    const addressInput = document.getElementById("session-address");
    const nextButton = document.getElementById("booking-next");
    const form = document.getElementById("session-form");
    const message = document.getElementById("booking-message");

    let selectedLocation = "";
    let selectedDuration = "";
    let selectedSessionType = "";
    let selectedGuestCount = "";

    function updateContinue() {
      const detailsComplete =
        selectedLocation === "beach"
          ? beachSelect.value !== ""
          : selectedLocation === "residence"
            ? addressInput.value.trim() !== ""
            : false;

      const sessionComplete = selectedSessionType !== "" &&
        (selectedSessionType !== "group" || selectedGuestCount !== "");

      nextButton.disabled = !selectedLocation ||
        !selectedDuration || !detailsComplete || !sessionComplete;
    }

    locationButtons.forEach(button => {
      button.addEventListener("click", () => {
        selectedLocation = button.dataset.location;

        locationButtons.forEach(item =>
          item.setAttribute("aria-pressed", String(item === button))
        );

        beachField.hidden = selectedLocation !== "beach";
        addressField.hidden = selectedLocation !== "residence";
        message.hidden = true;
        updateContinue();
      });
    });

    sessionTypeButtons.forEach(button => {
      button.addEventListener("click", () => {
        selectedSessionType = button.dataset.sessionType;

        if (selectedSessionType === "private") {
          selectedGuestCount = "1";
        } else if (selectedSessionType === "couples") {
          selectedGuestCount = "2";
        } else {
          selectedGuestCount = "";
        }

        sessionTypeButtons.forEach(item =>
          item.setAttribute("aria-pressed", String(item === button))
        );

        groupSizeField.hidden = selectedSessionType !== "group";
        groupSizeSelect.value = "";
        message.hidden = true;
        updateContinue();
      });
    });

    groupSizeSelect.addEventListener("change", () => {
      selectedGuestCount = groupSizeSelect.value;
      updateContinue();
    });

    durationButtons.forEach(button => {
      button.addEventListener("click", () => {
        selectedDuration = button.dataset.duration;

        durationButtons.forEach(item =>
          item.setAttribute("aria-pressed", String(item === button))
        );

        updateContinue();
      });
    });

    beachSelect.addEventListener("change", updateContinue);
    addressInput.addEventListener("input", updateContinue);

    form.addEventListener("submit", event => {
      event.preventDefault();

      sessionStorage.setItem("burnstrongBooking", JSON.stringify({
        locationType: selectedLocation,
        beach: selectedLocation === "beach" ? beachSelect.value : "",
        address: selectedLocation === "residence"
          ? addressInput.value.trim() : "",
        sessionType: selectedSessionType,
        sessionTypeLabel: selectedSessionType === "private"
          ? "Private Lesson"
          : selectedSessionType === "couples"
            ? "Couples Yoga"
            : "Private Group Session",
        guestCount: Number(selectedGuestCount),
        durationMinutes: Number(selectedDuration)
      }));

      window.location.href = "schedule.html";
    });
  </script>
</body>
</html>
